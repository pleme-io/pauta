[package]
name = "pauta-spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pauta-spec — the (defpautaaction) authoring surface: pauta's action vocabulary as tatara-lisp, from which the keymap, the legend and the --help are all derived so they cannot drift."
homepage = "https://github.com/pleme-io/pauta"
repository = "https://github.com/pleme-io/pauta"
license.workspace = true
categories = ["development-tools"]
keywords = ["tatara", "tui", "code-review", "pleme-io", "pauta"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
# ONE dep, not two: the derive macros arrive RENAMED through
# `tatara_lisp::DeriveTataraDomain`, so `tatara-lisp-derive` is never named
# here (banken's manifest makes the same point).
# The typed chord vocabulary. `:binding` is VALIDATED BY PARSING through
# `awase::Hotkey::parse` rather than by hand-rolled shape checks — parsing
# is strictly stronger (it also rejects an unknown key NAME, which a shape
# check cannot see) and it is the same vocabulary the runtime delivers in.
awase = "0.1"
tatara-lisp = "0.3.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
