[package]
name = "pauta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pauta — the PR-review quadro. Your docket: every pull request set down for your judgment, in order. Reads through metsuke, renders diffs with egaku, refreshes itself off the app task (QUADRO T14), and gates a binding verdict behind two keystrokes."
homepage = "https://github.com/pleme-io/pauta"
repository = "https://github.com/pleme-io/pauta"
documentation = "https://docs.rs/pauta"
readme = "README.md"
license.workspace = true
categories = ["command-line-utilities", "development-tools"]
keywords = ["tui", "github", "code-review", "pull-request", "pleme-io"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[workspace]
members = ["pauta-spec"]

# The shared version the workspace release flow bumps. Without this,
# `rust-auto-release.yml`'s bump job dies on
# `workspace.package.version not found` and `ship` never runs — pauta's
# first two releases failed exactly there. Same shape as banken and tear.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/pauta"

[dependencies]
# The authored action vocabulary — the keymap, legend and --help all derive
# from ONE (defpautaaction) catalog rather than three hand-written lists.
pauta-spec = { path = "pauta-spec", version = "0.1" }
# The typed review surface. pauta owns no GitHub knowledge of its own.
metsuke = { path = "../metsuke", version = "0.1" }
# Widget STATE (TableView, DiffView, TextArea, KeyMap) — named directly
# because pauta uses the models far more than the renderer's re-exports.
egaku = "0.1"
# The cell renderer + AsyncApp runtime. A plain version now: egaku-term
# 0.3.6 is on crates.io, carrying `AsyncApp::wake`/`on_wake` — the arm the
# T14 live plane is built on. It was pinned by git+rev because the crate was
# structurally unreleasable and crates.io had been frozen at 0.3.1.
egaku-term = { version = "0.3", features = ["tokio"] }
# ONE piece of izumi: refresh::{LiveStore, spawn_interval_refresh} — the
# fleet's blocking-read-on-a-cadence loop. Deliberately NOT izumi::Engine,
# whose subprocess Environment cannot express a typed client call.
izumi = "0.1"
# The session archetype's output types. praca owns the multi-pane plan +
# `instantiate`; pauta only builds a definition and hands it over — there is
# deliberately NO second pane-making mechanism here.
praca = "0.1.9"
tear-types = "0.1.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dev-dependencies]
# praça's recording MultiplexerControl double, so the archetype can be driven
# through the REAL `instantiate` rather than only validated. Opt-in feature,
# dev-only — nothing ships a fake multiplexer.
praca = { version = "0.1.9", features = ["testing"] }
